# Slot-YOLO OCM OBB: YOLOv8s + SlotDCE + ISAF + IG-LSF-AIFI + Geometry CCFF v1.1.
# 相对路径以本文件所在目录为基准；切换 v1/v1.1 时不要续训另一版本的权重。
model_type: slot_yolo
task: obb
backbone: yolov8s
module_version: v2
use_slotdce_isaf: true
use_rtdetrv2_hye_yolo: true
rtdetrv2_hye_yolo:
  use_ig_lsf_aifi: true
  use_geometry_ccff: false
  use_geometry_ccff_v1_1: true
  in_channels:
  - 128
  - 256
  - 512
  feat_strides:
  - 8
  - 16
  - 32
  ig_lsf_aifi: {}
  aifi:
    num_encoder_layers: 1
    nhead: 8
    dim_feedforward: 1024
    dropout: 0.0
    activation: gelu
    normalize_before: false
    pe_temperature: 10000.0
  ccff:
    num_blocks: 3
    expansion: 0.5
    activation: silu
data: ../datasets_config/OCM.yaml
enhancer:
  pretrained: true
  weights: ../slot_pt/best_loss.pth
  architecture_config: ../slot_yolo/myconfigv2/slotdce/slotDCE_v9_8_detector_lite.yaml
  freeze: false
  eval_when_frozen: true
  freeze_epochs: 5
  lr_scale: 0.05
  weight_decay: 1.0e-06
feature_modules:
  guidance:
    channels: 16
    hidden_channels: 24
    norm: bn
  isaf:
    reduction: 4
    norm: bn
    tone_gate_init: 0.2
    texture_gate_init: 0.35
    alignment_scale_init: 0.05
    texture_scale_init: 0.05
memory:
  checkpoint_enhancer: true
  checkpoint_backbone: false
  enhancer_amp: false
  enhancer_amp_dtype: bfloat16
fusion:
  p5_gate_init: 0.25
train:
  device: 4
  batch: 16
  nbs: 64
  epochs: 100
  patience: 100
  imgsz: 640
  seed: 0
  deterministic: true
  cache: false
  workers: 8
  output_dir: ../newoutput/{backbone}/slotdce_isaf_RTDETRV2_hyE_yolo_GEO1.1_OCM
  exist_ok: false
  save: true
  save_period: 10
  plots: true
  val: true
  resume: false
  pretrained: false
  amp: true
test:
  weights: null
  split: val
  device: 1
  batch: 16
  workers: 8
  imgsz: 640
  conf: 0.001
  iou: 0.7
  max_det: 300
  plots: true
  save_json: false
  output_dir: ../newoutput/test_output/{backbone}/slotdce_isaf_RTDETRV2_hyE_yolo_GEO1.1_OCM
  exist_ok: true
predict:
  enabled: false
  source: null
  device: 0
  imgsz: 640
  conf: 0.25
  iou: 0.7
  max_det: 300
  save: true
  save_txt: true
  save_conf: true
  output_dir: ../newoutput/predict_output/{backbone}/slotdce_isaf_RTDETRV2_hyE_yolo_GEO1.1_OCM
  exist_ok: true
